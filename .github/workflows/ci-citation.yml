name: ci-citation

on:
  pull_request:
    paths: ["CITATION.cff"]
  push:
    branches: [main]
    paths: ["CITATION.cff"]
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run cffconvert --validate
