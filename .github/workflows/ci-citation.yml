name: ci-citation

on:
  pull_request:
    paths: ["CITATION.cff", ".github/workflows/ci-citation.yml"]
  push:
    # `v*.*.x` is the release branch a release is tagged from, and any patch
    # release for that minor version is prepared on (developer/release.rst).
    # Without it a release branch runs no checks at all on push, and the commit
    # about to be tagged would be the least-tested on the repository.
    branches: [main, "v*.*.x"]
    paths: ["CITATION.cff", ".github/workflows/ci-citation.yml"]
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      # Written out rather than inherited: `permissions: {}` above sets every
      # scope to `none`, and a checkout reading without a grant depends on this
      # repository staying public (:issue:`286`).
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run cffconvert --validate
