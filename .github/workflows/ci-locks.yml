name: ci-locks

# `pixi.lock` pins the exact packages every other job installs, and nothing moves
# it on its own -- so left alone the whole of CI goes on testing the resolution of
# whichever day it was last written. This job moves the resolved point upward
# once a week and opens a pull request with what changed.
#
# It is the upper end of the declaration. `ci-floors` is the lower end: that one
# resolves each declared minimum and exercises what it resolves, and its header
# names this workflow as the counterpart it does not replace (floors spec §1).
#
# The pull request is opened by a dedicated bot account rather than with
# `github.token`, for one reason: GitHub does not run workflows on a pull request
# its own token authored, so the lock would arrive with no CI at all -- and the
# checks are the entire point of proposing it as a pull request rather than
# pushing it.
#
# That token is a *classic* one, which is a constraint rather than a preference.
# A fine-grained token reaches only repositories owned by the account that issued
# it, and this bot is a collaborator here rather than the owner, so per-repository
# scoping is not on offer and the scope is account-wide.
#
# What narrows it instead is the environment. `TEPHPY_BOT_TOKEN` is an
# environment secret of `development`, and an environment secret is readable only
# by a job that declares that environment -- so it is not, as a repository secret
# would be, readable by every workflow here.
#
# Scheduled, never a pull-request gate. It reaches the network to re-resolve, so
# it goes red for reasons no pull request caused (the reasoning `ci-floors`
# records for itself).

on:
  schedule:
    - cron: "7 5 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pixi-update:
    runs-on: ubuntu-latest
    # Declared so the job can read `TEPHPY_BOT_TOKEN`, and so that nothing which
    # does not declare it can.
    environment: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e  # v0.10.2
        with:
          run-install: false

      # `pixi update` rewrites the lock in place and reports what became of each
      # package; `pixi-diff-to-markdown` turns that into a pull-request body.
      #
      # Whether anything moved is asked of the JSON rather than of the prose. An
      # unchanged resolution still renders a file -- `No diff`, measured at eight
      # bytes on 2026-09-02 -- so a bot gated on the file merely existing opens an
      # empty pull request every week, which is what this guard was added to
      # geovista to stop. A length test stops it too, but only until the wording
      # changes: at a threshold of ten bytes that one sat two bytes from passing
      # `No diff` through, and it would fail open, silently, into a weekly empty
      # pull request that looks like a working bot.
      #
      # `.environment` is pixi's own answer to the same question, and it does not
      # depend on how anything is worded: empty when nothing moved, and one entry
      # per environment when something did (seven, measured the same day). `diff.md`
      # therefore exists only when there is something to propose, and every step
      # below stays gated on it.
      #
      # Read the JSON with a tool that is merely *usually* present and the failure
      # mode is silence: the reader is absent, nothing is reported as moved, no
      # pull request is opened, and the run is green -- a bot that has stopped
      # working and says so nowhere.
      #
      # `set -e` covers that, but only because the reader runs in an assignment.
      # As the condition of an `if` -- which is the obvious way to write this, and
      # was how this step was first written -- a failing command is exempt from
      # `set -e` by definition, so a missing interpreter reads as "nothing moved"
      # and the step still passes. Measured both ways before settling on this one.
      # `python3` rather than `jq` because the interpreter this project cannot run
      # without is the one least likely to be the thing that is absent.
      - name: Refresh the lock
        run: |
          set -euo pipefail
          pixi update --json > update.json
          moved=$(python3 -c "import json; print(len(json.load(open('update.json'))['environment']))" < /dev/null)
          if [ "${moved}" -gt 0 ]; then
            pixi exec pixi-diff-to-markdown < update.json > diff.md
          fi

      # Regenerated from the same manifest the lock was just solved against, so
      # the two travel together in one pull request. `tests/test_environment_file.py`
      # holds this file to what the export produces, and runs on this bot's pull
      # request like any other -- which is the check standing over what the bot
      # wrote, and the reason the bot needs a token that triggers CI at all.
      - name: Refresh the environment file
        if: ${{ hashFiles('diff.md') }}
        # `printf` around the command substitution is what stores the file the
        # way this repository stores every file: the export ends in a blank line,
        # and `end-of-file-fixer` would take it off the moment pre-commit saw the
        # bot's pull request. Writing the settled form here means the bot commits
        # what the hooks would have made of it, and
        # `tests/test_environment_file.py` compares against that same form.
        run: |
          printf '%s\n' "$(pixi workspace export conda-environment \
            --environment default --name tephpy)" > requirements/tephpy.yml

      - name: Propose the update
        id: cpr
        if: ${{ hashFiles('diff.md') }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.TEPHPY_BOT_TOKEN }}
          add-paths: |
            pixi.lock
            requirements/tephpy.yml
          commit-message: "Move the resolved point upward"
          branch: pixi-auto-update
          base: main
          delete-branch: true
          title: "Refresh the lock and the environment file"
          body-path: diff.md
          labels: |
            new: pull-request
            bot
            pixi
            skip-changelog

      # A scheduled job nobody watches reports to its own run, so what it did is
      # readable without opening the log.
      - name: Report what was proposed
        if: ${{ hashFiles('diff.md') }}
        env:
          NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          URL: ${{ steps.cpr.outputs.pull-request-url }}
          OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
        run: |
          {
            echo "### Lock refresh"
            echo
            echo "- pull request: [#${NUMBER}](${URL})"
            echo "- operation: ${OPERATION}"
          } >> "${GITHUB_STEP_SUMMARY}"
