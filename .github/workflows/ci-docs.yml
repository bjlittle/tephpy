name: ci-docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347  # v0.10.1
        with:
          environments: docs
          frozen: true
      - run: pixi run --frozen --environment docs make -C docs html
      - run: >
          pixi run --frozen --environment docs
          python .github/scripts/check_rendered_citations.py docs/_build/html
      - run: >
          pixi run --frozen --environment docs
          python .github/scripts/check_documentation_links.py docs/_build/html
      # Both of the steps below reach the network -- one installs a browser and
      # its system libraries, the other loads PyScript, Pyodide and the wheels
      # from a CDN -- so both are retried. Each attempt is bounded from inside
      # the shell rather than by the step's `timeout-minutes`, because both
      # attempts share one step: a step-level bound cancels the pair, leaving
      # the retry covering only a fast failure and never a stall. An unbounded
      # first attempt is a retry that never happens, which is how a stalled
      # browser install spent the job's whole budget instead of failing over.
      - name: Install the demo's browser
        run: |
          for attempt in 1 2; do
            if timeout -k 30 180 pixi run --frozen --environment docs \
                playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::browser install attempt ${attempt} failed or stalled"
            sleep 15
          done
          exit 1
      - name: Check the browser demo
        run: |
          for attempt in 1 2; do
            if timeout -k 30 600 pixi run --frozen --environment docs \
                python .github/scripts/check_browser_demo.py; then
              exit 0
            fi
            echo "::warning::browser demo attempt ${attempt} failed or stalled"
            sleep 15
          done
          exit 1
