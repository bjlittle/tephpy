name: ci-docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f  # v0.10.0
        with:
          environments: docs
          frozen: true
      - run: pixi run --frozen --environment docs make -C docs html
      - run: >
          pixi run --frozen --environment docs
          python .github/scripts/check_rendered_citations.py docs/_build/html
      - run: >
          pixi run --frozen --environment docs
          python .github/scripts/check_documentation_links.py docs/_build/html
