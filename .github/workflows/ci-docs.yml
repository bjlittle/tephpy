name: ci-docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347  # v0.10.1
        with:
          environments: docs
          frozen: true
      - run: pixi run --frozen --environment docs make -C docs html
      - run: >
          pixi run --frozen --environment docs
          python .github/scripts/check_rendered_citations.py docs/_build/html
      - run: >
          pixi run --frozen --environment docs
          python .github/scripts/check_documentation_links.py docs/_build/html
      - run: >
          pixi run --frozen --environment docs playwright install --with-deps chromium ||
          pixi run --frozen --environment docs playwright install --with-deps chromium
      - run: >
          pixi run --frozen --environment docs
          python .github/scripts/check_browser_demo.py ||
          pixi run --frozen --environment docs
          python .github/scripts/check_browser_demo.py
