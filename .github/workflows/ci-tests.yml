name: ci-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]  # linux-64 only — the initial platform support
        environment: ["test-py312", "test-py313", "test-py314"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347  # v0.10.1
        with:
          environments: ${{ matrix.environment }}
          frozen: true
      - run: pixi run --frozen --environment ${{ matrix.environment }} pytest --cov --cov-report=xml --mpl
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        if: matrix.os == 'ubuntu-latest' && matrix.environment == 'test-py314'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
