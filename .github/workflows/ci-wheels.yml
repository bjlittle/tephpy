name: ci-wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # `MANIFEST.in` says what the distributions leave out, and nothing but a
  # build reads it. It has gone stale once already, when a `prune` stopped
  # matching a directory that had moved and only a hand-run build noticed
  # (:issue:`77`). Here rather than in a workflow of its own: this is where the
  # distributions are built, so this is where a manifest that no longer
  # describes them should be reported.
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # `setuptools_scm` reads the tags to resolve a version, and
          # `check-manifest` builds an sdist twice over.
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347  # v0.10.1
        with:
          environments: devs
          frozen: true
      # Named as a task rather than spelled out, so a contributor reproducing a
      # failure runs what this job runs and the declared `check-manifest` floor
      # is the one exercised (:issue:`120`).
      - run: pixi run --frozen --environment devs manifest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: pipx run build
      - run: pipx run twine check dist/*
      - name: Wheel install smoke test
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          import tephpy
          fig, ax = plt.subplots(subplot_kw={"projection": "tephigram"})
          assert type(ax).__name__ == "TephigramAxes", type(ax)
          # The sample data and the gallery header are package data, not
          # Python, so only an installed wheel can prove they were shipped
          # (gallery spec §3.7). Reading a sounding covers the sample file,
          # which `tephpy.samples` genuinely reads from an installed tephpy.
          # Nothing reads the header from one -- sphinx-gallery globs the
          # checkout directory `examples_dirs` names -- so the assertion below
          # guards the `package-data` entry alone: without it the wheel's
          # `tephpy.examples` is missing a file the sdist ships and the gallery
          # offers for download.
          from importlib.resources import files
          snd = tephpy.samples.sounding("norman-12z")
          assert snd.wind_speed is not None
          header = files("tephpy.examples") / "GALLERY_HEADER.rst"
          assert header.is_file(), header
          print("wheel smoke OK:", tephpy.__version__)
          PY
          /tmp/smoke/bin/tephpy examples list
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: test-pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true

  publish-pypi:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          print-hash: true
