name: ci-wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # `MANIFEST.in` says what the distributions leave out, and nothing but a
  # build reads it. It has gone stale once already, when a `prune` stopped
  # matching a directory that had moved and only a hand-run build noticed
  # (:issue:`77`). Here rather than in a workflow of its own: this is where the
  # distributions are built, so this is where a manifest that no longer
  # describes them should be reported.
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # `setuptools_scm` reads the tags to resolve a version, and
          # `check-manifest` builds an sdist twice over.
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347  # v0.10.1
        with:
          environments: devs
          frozen: true
      # Named as a task rather than spelled out, so a contributor reproducing a
      # failure runs what this job runs and the declared `check-manifest` floor
      # is the one exercised (:issue:`120`).
      - run: pixi run --frozen --environment devs manifest

  build:
    # In front of the build rather than beside it. Both publishers take their
    # distributions from this job, and the job uploads them as an artifact
    # besides, so a manifest that no longer describes what ships has to stop
    # the distribution being made at all -- not merely report while it is
    # uploaded anyway. `tests/test_manifest_gate.py` holds every publisher to
    # reaching the gate, however the graph is rearranged later.
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: pipx run build
      - run: pipx run twine check dist/*
      - name: Wheel install smoke test
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          import tephpy
          fig, ax = plt.subplots(subplot_kw={"projection": "tephigram"})
          assert type(ax).__name__ == "TephigramAxes", type(ax)
          # The sample data is package data, not Python, so only an installed
          # wheel can prove it was shipped (gallery spec §3.7). Reading a
          # sounding covers it, and `tephpy.samples` is what genuinely reads it
          # from an installed tephpy.
          #
          # `GALLERY_HEADER.rst` was asserted here too, until the distributions
          # stopped carrying the repository around the package. That assertion
          # rested on the header being a file "the sdist ships and the gallery
          # offers for download": the sdist no longer ships it, and the download
          # sphinx-gallery offers is built from the checkout it globs, never
          # from an install. Nothing reads it from one, so nothing needs it in
          # one (`docs/src/developer/packaging.rst`).
          snd = tephpy.samples.sounding("norman-12z")
          assert snd.wind_speed is not None
          print("wheel smoke OK:", tephpy.__version__)
          PY
          /tmp/smoke/bin/tephpy examples list
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: test-pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true

  publish-pypi:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          print-hash: true
