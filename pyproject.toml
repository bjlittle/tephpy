[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77.0.3", "setuptools_scm>=8"]

[project]
authors = [{ name = "tephpy Contributors" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Visualization",
]
description = "Plot and analyse tephigrams, with MetPy-powered thermodynamic analysis."
dynamic = ["dependencies", "optional-dependencies", "readme", "version"]
keywords = [
  "tephigram",
  "meteorology",
  "thermodynamics",
  "sounding",
  "matplotlib",
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
name = "tephpy"
requires-python = ">=3.12"

[project.urls]
Issues = "https://github.com/bjlittle/tephpy/issues"
Repository = "https://github.com/bjlittle/tephpy"

[project.scripts]
tephpy = "tephpy._cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements/pypi-core.txt"] }
readme = { file = "README.md", content-type = "text/markdown" }

[tool.setuptools.dynamic.optional-dependencies]
devs = { file = ["requirements/pypi-optional-devs.txt"] }
docs = { file = ["requirements/pypi-optional-docs.txt"] }
test = { file = ["requirements/pypi-optional-test.txt"] }

[tool.setuptools.package-data]
tephpy = ["py.typed", "plotting/_static/*.png"]

[tool.setuptools.packages.find]
include = ["tephpy*"]
where = ["src"]

[tool.setuptools_scm]
local_scheme = "dirty-tag"
version_file = "src/tephpy/_version.py"
version_scheme = "release-branch-semver"

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
  "--strict-config",
  "--strict-markers",
  "-ra",
]
filterwarnings = ["error"]
log_level = "INFO"
markers = ["mpl_image_compare: matplotlib image comparison tests"]
minversion = "8.0"
mpl-baseline-path = "tests/baseline"
mpl-results-path = ".mpl-results"
testpaths = ["tests"]
xfail_strict = true

[tool.codespell]
# `astroid` is the parser sphinx-autoapi drives, not a misspelling of "asteroid".
ignore-words-list = "accreting,astroid,PRES"

[tool.coverage.run]
branch = true
omit = ["*/_version.py"]
source = ["tephpy"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
show_missing = true

[tool.ruff]
line-length = 88
src = ["src", "tests", "docs/src"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
# Allow information-source (U+2139) which could be confused for "i".
allowed-confusables = ["ℹ"]
explicit-preview-rules = true
extend-select = ["CPY001"]
ignore = [
  "COM812",  # trailing comma missing (conflicts with formatter)
  "COM819",  # trailing comma prohibited
  "D105",    # missing docstring in magic method
  "FBT002",  # boolean default positional argument
  "FIX002",  # line contains TODO
  "ISC001",  # implicit string concat (conflicts with formatter)
  "N806",    # variable in function should be lowercase (T, P are physics symbols)
  "PLR2004", # magic value in comparison
  "S101",    # use of assert (pytest)
  "TD003",   # missing issue link after TODO
]
preview = true
select = ["ALL", "D212"]

[tool.ruff.lint.flake8-copyright]
notice-rgx = '''
# Copyright \(c\) 2026, tephpy Contributors\.
#
# This file is part of tephpy and is distributed under the 3-Clause BSD license\.
# See the LICENSE file in the package root directory for licensing details\.
'''

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["tephpy"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.mccabe]
# TODO @bjlittle: refactor to reduce the complexity, if possible
max-complexity = 17

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
# TODO @bjlittle: refactor to reduce the complexity, if possible
max-branches = 16
max-positional-args = 6
max-statements = 53

[tool.ruff.lint.per-file-ignores]
".github/scripts/*.py" = [
  # flake8-boolean-trap (FBT)
  # https://docs.astral.sh/ruff/rules/#flake8-boolean-trap-fbt
  "FBT001", # flake8-boolean-trap: Boolean-typed positional argument in function definition.
  # https://docs.astral.sh/ruff/rules/print/
  "T201",   # flake8-print: print found.
  "INP001", # repository scripts are executed by path, not imported as a package
]
"docs/browser/*.py" = [
  "ANN401",   # browser DOM and Pyodide proxy objects are dynamically typed
  "ASYNC240", # Pyodide's virtual filesystem has no async pathlib alternative
  "BLE001",   # surface any parser, Sounding, matplotlib, or runtime error in the UI
  "INP001",   # staged scripts, not an importable package
  "RUF006",   # PyScript's event loop retains the application startup task
]
"docs/build_browser.py" = [
  "INP001", # documentation build script, executed by path
  "T201",   # report the staged application path to the docs build log
]
"docs/src/conf.py" = ["INP001", "A001"]
# The Sphinx extension directory is a ``sys.path`` entry at build time, not a
# package: an ``__init__.py`` would stop Sphinx resolving ``tephpy_citation_xrefs``
# by top-level module name (docs spec §3.7).
"docs/src/_ext/*.py" = ["INP001"]
# A gallery example opens with sphinx-gallery's title block -- an RST section
# heading, not a docstring summary -- and declares its tags in the comment flag
# sphinx-gallery reads (gallery spec §3.2, §3.6).
"src/tephpy/examples/plot_*.py" = [
  "D205",   # blank line required between summary line and description
  "D400",   # first line should end with a period
  "ERA001", # commented-out code (the ``sphinx_gallery_tags`` flag)
  # Importing tephpy is what registers the "tephigram" projection, so the
  # diagram example imports it and never names it again. A ``# noqa`` on the
  # line would be a linter directive in code the gallery invites a reader to
  # copy, which docs-style.rst rules out; the import carries a comment
  # saying why it is there instead.
  "F401", # imported but unused
]
# DTZ001: naive datetimes are deliberate fixtures — the boundary under
# test reads them as UTC (spec §3.4).
"tests/*" = ["ANN001", "ANN003", "ANN201", "ANN202", "DTZ001", "SLF001", "D103"]
# One-shot generator scripts (spec §7 layer 4), not package modules; their
# print is the script's user feedback.
"tests/fixtures/generate_*.py" = [
  "INP001",
  # The IGRA sources are ``https://`` literals a few lines above the call, but
  # they reach ``urlopen`` through a table and a loop variable, so ruff can no
  # longer read the scheme off the argument (gallery spec §3.1).
  "S310",
  "SLF001",
  "T201",
]
# The tests tree mirrors the package (spec §8.5): tests/io shadows nothing
# importable — it is reached as tests.io.
"tests/io/__init__.py" = ["A005"]

[tool.mypy]
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src/tephpy"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# MetPy, pint, and pandas ship partial/absent stubs; do not fail on their
# imports.
ignore_missing_imports = true
module = ["metpy.*", "pandas.*", "pint.*"]

[[tool.mypy.overrides]]
# A projection is registered at runtime, so `plt.subplots(subplot_kw=
# {"projection": "tephigram"})` is typed `Axes` and every tephigram method
# on it is `attr-defined`. That is matplotlib's projection registry, not a
# tephpy defect -- cartopy's `GeoAxes` types the same way -- and the answer
# for library code is a `cast`. The examples are not library code: they are
# what a user writes, published for a user to copy, so they are written that
# way and the one error class that follows is disabled here (gallery
# spec §3.3). Everything else mypy checks about them still applies.
disable_error_code = ["attr-defined"]
module = ["tephpy.examples.*"]

[tool.repo-review]
ignore = [
  "PC111", # use blacken-docs (flaky)
  "PC180", # prettier (not used)
  "PP006", # dev dependency group
]

[tool.numpydoc_validation]
checks = ["all", "GL01", "GL02", "GL03", "SA01", "ES01", "EX01", "YD01"]

[tool.towncrier]
directory = "changelog"
filename = "CHANGELOG.rst"
# The fragment is named for its pull request, and towncrier appends that number to
# every entry. Its default renders it as plain text, which is the docs spec §3.8
# defect one level up: a reader of the published changelog sees `#103` and cannot
# follow it. The role is the same one a fragment writes by hand.
issue_format = ":pull:`{issue}`"
package = "tephpy"
package_dir = "src"
template = "changelog/template.rst"

[[tool.towncrier.type]]
directory = "breaking"
name = "💣 Breaking Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "✨ New Features"
showcontent = true

[[tool.towncrier.type]]
directory = "enhancement"
name = "🚀 Enhancements"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "🐛 Bug Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "dependency"
name = "🔗 Dependencies"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "📚 Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "💼 Internal"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "🧰 Miscellaneous"
showcontent = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
tephpy = { path = ".", editable = true }

[tool.pixi.dependencies]
click = ">=8.1"
matplotlib-base = ">=3.11"
metpy = ">=1.7"
numpy = ">=2.0"
pandas = ">=2.3"
pint = ">=0.24.4"
platformdirs = ">=4.0"
pyyaml = ">=6.0.1"
# The `[build-system] requires` of this file, which the `--no-isolation` build in
# `test_masters_ship_in_the_wheel` takes from the environment rather than
# provisioning. The PyPI counterpart is declared in the `test` extra, not in
# `requirements/pypi-core.txt`: that file is `[project] dependencies`, and neither
# package is a runtime requirement of the installed wheel (:issue:`152`).
setuptools = ">=77.0.3"
setuptools-scm = ">=8"
xarray = ">=2024.10"

[tool.pixi.environments]
# "default" deliberately carries the tooling features so unqualified
# `pixi run <task>` (tests, docs, lint, ...) resolves without ambiguity.
default = { features = [
  "test",
  "docs",
  "devs",
  "py314",
], solve-group = "default" }
devs = { features = ["test", "docs", "devs", "py314"], solve-group = "default" }
docs = { features = ["docs", "devs", "py314"], solve-group = "default" }
test = { features = ["test", "devs", "py314"], solve-group = "default" }
test-py312 = { features = ["test", "devs", "py312"], solve-group = "py312" }
test-py313 = { features = ["test", "devs", "py313"], solve-group = "py313" }
test-py314 = { features = ["test", "devs", "py314"], solve-group = "py314" }

[tool.pixi.feature.py312.dependencies]
pip = ">=25.0"
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
pip = ">=25.0"
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
pip = ">=25.0"
python = "3.14.*"

[tool.pixi.feature.test.dependencies]
hypothesis = ">=6.100"
# The notebook branch of the citation gate (docs spec §3.6) locates a source line
# by the shape `nbformat` writes it in, so its fixture is written by `nbformat`
# rather than in its likeness. The docs feature already brings it in through
# myst-nb; it is declared here as well because the CI matrix runs the `test-py3*`
# environments, which carry no docs feature, and a fixture the tests skip when the
# package is absent would verify nothing where the matrix runs (:issue:`95`).
nbformat = ">=5.10"
# Orders candidate versions by PEP 440, under which `10.0.5` sorts below `8`
# (floors spec §3.2). `tests/test_import.py` and `tests/test_floors.py` both import
# it, and it arrives today only as a matplotlib transitive, which is not a
# declaration -- the same reasoning configfile spec §7 records for `platformdirs`.
# Declared here rather than under `devs` because the generated `core + test` tier
# of floors spec §3.3 carries no `devs`, and that is where the suite runs. The
# floor is `24.2` rather than the `24.0` that ordering alone needs: `setuptools
# >=77` canonicalizes this project's PEP 639 `license` expression through
# `packaging.licenses`, added in `24.2`, and raises `ImportError` below it --
# which fails the wheel build `test_masters_ship_in_the_wheel` shells out to
# (:issue:`152`).
packaging = ">=24.2"
pytest = ">=8.0"
pytest-cov = ">=5.0"
pytest-mpl = ">=0.17"
# `test_masters_ship_in_the_wheel` shells out to `python -m build`. Every
# committed environment pairs `test` with `devs`, where this used to be declared,
# so the test suite's need for it never had to be stated -- but the generated
# `core + test` of floors spec §3.3 carries no `devs`, and there the test fails on
# every run with no package floor behind it to attribute. A package the test suite
# runs is a test dependency wherever it happens to be declared today, exactly as
# `nbformat` above (:issue:`95`).
python-build = ">=1.5"

[tool.pixi.feature.test.tasks.tests]
cmd = "pytest --cov --cov-report=xml --mpl"
description = "Run the unit test suite with coverage"

[tool.pixi.feature.test.tasks.baselines]
cmd = "pytest --mpl-generate-path=tests/baseline"
description = "Regenerate matplotlib image-comparison baselines"

[tool.pixi.feature.test.tasks.tests-clean]
cmd = "rm -rf .coverage coverage.xml .pytest_cache .mpl-results .hypothesis"
description = "Remove coverage, pytest, pytest-mpl, and hypothesis artifacts"

[tool.pixi.feature.devs.dependencies]
check-manifest = ">=0.49"
mypy = ">=1.13"
pre-commit = ">=4.0"
ruff = ">=0.15"
zizmor = ">=1.9.0"

[tool.pixi.feature.devs.tasks.lint]
cmd = "pre-commit run --all-files"
description = "Run all pre-commit hooks"

[tool.pixi.feature.docs.dependencies]
make = ">=4.3"
myst-nb = ">=1.1"
numpydoc = ">=1.8"
pydata-sphinx-theme = ">=0.16"
python-build = ">=1.5"
sphinx = ">=8.0"
sphinx-autoapi = ">=3.6.1"
sphinx-click = ">=6.0"
sphinx-copybutton = ">=0.5"
sphinx-design = ">=0.6.1"
sphinx-gallery = ">=0.17"
sphinx-togglebutton = ">=0.3"
sphinx_changelog = ">=1.6"
sphinxcontrib-bibtex = ">=2.6"
towncrier = ">=24.8"

[tool.pixi.feature.docs.pypi-dependencies]
playwright = ">=1.55"

[tool.pixi.feature.docs.tasks.docs-html]
cmd = "make html"
cwd = "docs"
depends-on = ["docs-clean"]
description = "Build the HTML documentation"

[tool.pixi.feature.docs.tasks.docs-browser-test]
cmd = "python .github/scripts/check_browser_demo.py"
depends-on = ["docs-html"]
description = "Exercise the built PyScript demo in Chromium"

[tool.pixi.feature.docs.tasks.docs-check-citations]
cmd = "python .github/scripts/check_rendered_citations.py docs/_build/html"
depends-on = ["docs-html"]
description = "Check that every rendered citation became a link"

[tool.pixi.feature.docs.tasks.docs-check-links]
cmd = "python .github/scripts/check_documentation_links.py docs/_build/html"
depends-on = ["docs-html"]
description = "Check that every documentation link resolves in the build"

[tool.pixi.feature.docs.tasks.docs-check-figures]
cmd = "python .github/scripts/check_docs_figures.py docs/_build/html"
depends-on = ["docs-html"]
description = "Check that every published figure matches its baseline"

# Blesses whatever the build just rendered, which is why it is a task a
# contributor runs deliberately and not something `docs` depends on: the diff it
# writes into `docs/baseline` is the thing to read before committing, and a
# regression approves just as quietly as an improvement (plots spec §3.6).
[tool.pixi.feature.docs.tasks.docs-figures]
cmd = "python .github/scripts/bless_docs_figures.py docs/_build/html"
depends-on = ["docs-html"]
description = "Re-bless the published figure baselines from the build"

# The gate of docs spec §3.7, the documentation-link check and the figure gate of
# plots spec §3.5 all read the build's output, and the first two ran only in
# `ci-docs.yml` until :issue:`91`. Each script has a test module of its own —
# `tests/test_rendered_citations.py`, `tests/test_documentation_links.py` and
# `tests/test_docs_figures.py` — so what `pixi run tests` and `pixi run lint`
# could not see is not the scripts but each gate's verdict over a real build, and
# a build that linked no citation at all exits 0. `docs` therefore depends on all
# three, and a contributor reproduces those `ci-docs` failures without pushing.
# The fourth gate the job runs is the one below.
[tool.pixi.feature.docs.tasks.docs]
depends-on = ["docs-check-citations", "docs-check-links", "docs-check-figures"]
description = "Build the HTML documentation and check its output"

# The fourth gate `ci-docs.yml` runs, and the one `docs` above leaves out on
# purpose. `docs-browser-test` needs a Chromium this environment does not
# provide: pixi installs Playwright, not the browser it drives, and not the
# system libraries that browser links against -- so where either is missing it
# fails in a page of browser log, and a contributor correcting a docstring is
# who would meet it. It is also the slowest gate, the only one reaching the
# network, and the one `ci-docs.yml` has to retry (:pull:`165`). So `docs` stays
# the fast check `CONTRIBUTING.md` and the pull-request template name, and this
# is the whole set. Which leaves the set written out by hand in two places, so
# `tests/test_docs_workflow.py` holds them to each other: what this task runs is
# what the job runs, and the browser demo is the only thing `docs` omits
# (:issue:`171`).
[tool.pixi.feature.docs.tasks.docs-all]
depends-on = ["docs", "docs-browser-test"]
description = "Build the HTML documentation and run every gate ci-docs runs"

[tool.pixi.feature.docs.tasks.docs-clean]
cmd = "make clean"
cwd = "docs"
description = "Remove built documentation artifacts"

[tool.pixi.feature.docs.tasks.serve-html]
cmd = "python -m http.server 11000 --directory _build/html"
cwd = "docs"
description = "Serve built docs on http://localhost:11000"
