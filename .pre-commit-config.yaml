ci:
  autofix_prs: false
  autofix_commit_msg: "style: pre-commit.ci auto-fixes"
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autoupdate_schedule: weekly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: "pixi.lock"
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
        exclude: '\.svg$|^tests/fixtures/io/'
      - id: mixed-line-ending
        exclude: '^tests/fixtures/io/'
      - id: no-commit-to-branch
      - id: trailing-whitespace
        # The io fixtures are byte-faithful archive captures (their records
        # legitimately end with a trailing space).
        exclude: '^tests/fixtures/io/'

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject
        additional_dependencies: ["validate-pyproject-schema-store[all]"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: ["--fix", "--show-fixes"]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"]
        types_or: [python, markdown, rst]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        pass_filenames: false
        additional_dependencies: ["matplotlib==3.11.*", "numpy", "types-docutils"]

  - repo: https://github.com/numpy/numpydoc
    rev: v1.11.0rc0
    hooks:
      - id: numpydoc-validation
        files: '^src/'

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      - id: python-no-eval
      - id: python-no-log-warn
      - id: python-use-type-annotations
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal
      - id: text-unicode-replacement-char

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-dependabot
      - id: check-github-workflows
      - id: check-readthedocs

  - repo: https://github.com/scientific-python/cookie
    rev: 2026.06.18
    hooks:
      - id: sp-repo-review
        args: ["--show=errskip"]

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        args: ["--option", "reorder_keys=true"]

  - repo: https://github.com/sphinx-contrib/sphinx-lint
    rev: v1.0.2
    hooks:
      - id: sphinx-lint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.28.0
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      # Citations name a section by number, so renumbering strands them silently
      # (docs spec §3.6). Editing a spec heading breaks citations in files the
      # commit never touches, so this runs over the whole tree, not the staged
      # files.
      - id: check-citations
        name: design specification citations resolve
        entry: .github/scripts/check_citations.py
        language: python
        always_run: true
        pass_filenames: false
